<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Mellynna OS - Work
    </title>

    <link
        rel="stylesheet"
        href="work.css"
    >
</head>


<body>

    <div class="app-layout">


        <!-- ============================== -->
        <!-- SIDEBAR -->
        <!-- ============================== -->

        <aside class="sidebar">

            <div class="brand">

                <h2>
                    🦋 Mellynna OS
                </h2>

                <p>
                    Your Life, Organized.
                </p>

            </div>


            <nav class="navigation">

                <a
                    href="home.html"
                    class="nav-link"
                >
                    Home
                </a>

                <a
                    href="smart-inbox.html"
                    class="nav-link"
                >
                    Smart Inbox
                </a>

                <a
                    href="work.html"
                    class="nav-link active"
                >
                    Work
                </a>

                <a
                    href="personal.html"
                    class="nav-link"
                >
                    Personal
                </a>

                <a
                    href="planner.html"
                    class="nav-link"
                >
                    Planner
                </a>

                <a
                    href="grocery.html"
                    class="nav-link"
                >
                    Grocery
                </a>

                <a
                    href="expenses.html"
                    class="nav-link"
                >
                    Expenses
                </a>

                <a
                    href="meals.html"
                    class="nav-link"
                >
                    Meals & Recipes
                </a>

            </nav>


            <div class="sidebar-bottom">

                <a
                    href="login.html"
                    class="logout-link"
                >
                    Logout
                </a>

            </div>

        </aside>



        <!-- ============================== -->
        <!-- MAIN CONTENT -->
        <!-- ============================== -->

        <main class="main-content">


            <!-- ============================== -->
            <!-- PAGE HEADER -->
            <!-- ============================== -->

            <section class="page-header">

                <div>

                    <p class="page-label">
                        Work Space
                    </p>

                    <h1>
                        Work 💼
                    </h1>

                    <p class="page-description">
                        Manage your office tasks and deadlines.
                    </p>

                </div>


                <button
                    type="button"
                    id="show-work-form"
                    class="primary-button"
                >
                    + Add Task
                </button>

            </section>



            <!-- ============================== -->
            <!-- SUMMARY -->
            <!-- ============================== -->

            <section class="work-summary">


                <div class="summary-card">

                    <p>
                        Open Tasks
                    </p>

                    <h2 id="work-open-count">
                        0
                    </h2>

                </div>


                <div class="summary-card">

                    <p>
                        Completed
                    </p>

                    <h2 id="work-completed-count">
                        0
                    </h2>

                </div>


                <div class="summary-card">

                    <p>
                        Due Today
                    </p>

                    <h2 id="work-today-count">
                        0
                    </h2>

                </div>


            </section>



            <!-- ============================== -->
            <!-- ADD / EDIT FORM -->
            <!-- ============================== -->

            <section
                id="work-form"
                class="task-form hidden"
            >

                <h2 id="work-form-title">
                    Add Work Task
                </h2>


                <div class="form-grid">


                    <!-- TASK NAME -->

                    <label>

                        Task Name

                        <input
                            type="text"
                            id="work-task-name"
                            placeholder="Example: Follow up supplier"
                        >

                    </label>


                    <!-- DUE DATE -->

                    <label>

                        Due Date

                        <input
                            type="date"
                            id="work-task-date"
                        >

                    </label>


                </div>


                <!-- NOTES -->

                <label class="notes-label">

                    Notes

                    <textarea
                        id="work-task-notes"
                        rows="4"
                        placeholder="Example: Waiting for supplier quotation..."
                    ></textarea>

                </label>


                <!-- BUTTON -->

                <div class="form-buttons">

                    <button
                        type="button"
                        id="cancel-work-task"
                        class="secondary-button"
                    >
                        Cancel
                    </button>


                    <button
                        type="button"
                        id="save-work-task"
                        class="primary-button"
                    >
                        Add Task
                    </button>

                </div>

            </section>



            <!-- ============================== -->
            <!-- TASK LIST -->
            <!-- ============================== -->

            <section class="task-section">


                <div class="section-header">

                    <div>

                        <h2>
                            Work Tasks
                        </h2>

                        <p>
                            Your current office tasks.
                        </p>

                    </div>


                    <span id="work-task-count">
                        0 Tasks
                    </span>

                </div>


                <div
                    id="work-task-list"
                    class="task-list"
                >
                </div>


            </section>


        </main>

    </div>



    <!-- WORK JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth.js"></script>

    <script src="work.js"></script>


</body>

</html>
